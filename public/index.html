<style>
/* Layout: satu kolom sempit dengan jam 24 jam sebagai pusat, navigasi bawah untuk jempol. Malam = nila puasa, siang = kunyit makan. */
:root{
  --bg:#EBF0F5;--surface:#FBFCFE;--ink:#15213A;--muted:#55627A;--line:#D2DBE6;
  --fast:#2D49A6;--fast-soft:#C3CEEE;--on-fast:#FFFFFF;
  --eat:#E0A100;--eat-soft:#F8E7B4;--on-eat:#241A00;
  --good:#16794C;--warn:#A85A00;--bad:#B3261E;
  --fig:#15213A;--fig2:#9AA8C0;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1424;--surface:#161F34;--ink:#E8EDF6;--muted:#9EABC2;--line:#2A3651;
  --fast:#8FA6F7;--fast-soft:#2B3A68;--on-fast:#0D1424;
  --eat:#F2BC3F;--eat-soft:#4A3A10;--on-eat:#241A00;
  --good:#58C78F;--warn:#F0A95A;--bad:#F2877F;
  --fig:#E8EDF6;--fig2:#5C6A88;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1424;--surface:#161F34;--ink:#E8EDF6;--muted:#9EABC2;--line:#2A3651;
  --fast:#8FA6F7;--fast-soft:#2B3A68;--on-fast:#0D1424;
  --eat:#F2BC3F;--eat-soft:#4A3A10;--on-eat:#241A00;
  --good:#58C78F;--warn:#F0A95A;--bad:#F2877F;
  --fig:#E8EDF6;--fig2:#5C6A88;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
a{color:var(--fast)}
:focus-visible{outline:2px solid var(--fast);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn svg{width:22px;height:22px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.section{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row>*{min-width:0}
.row>.btn{flex:none}
.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--fast);border-color:var(--fast);color:var(--on-fast)}
.btn.eat{background:var(--eat);border-color:var(--eat);color:var(--on-eat)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.88rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.link{background:none;border:0;padding:8px 2px;color:var(--fast);font-weight:600;cursor:pointer;text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--fast-soft);color:var(--ink)}
.pill.eat{background:var(--eat-soft)}
.pill.ok{background:none;box-shadow:inset 0 0 0 1.5px var(--good);color:var(--good)}
/* jam */
.dial{position:relative;width:min(100%,330px);margin:0 auto;aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;display:block}
.dial-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:0 22%}
.timer{font-family:var(--display);font-size:clamp(1.9rem,10.2vw,2.3rem);line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.phase{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.phase span{height:7px;border-radius:2px;background:var(--line)}
.phase span.on{background:var(--fast)}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{width:26px;height:32px;border-radius:4px 4px 8px 8px;border:1.5px solid var(--fast);background:none;padding:0;cursor:pointer}
.pip.on{background:var(--fast)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* menu + panduan */
details.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::after{content:"+";font:500 1.4rem/1 var(--display);color:var(--muted);flex:none}
details.item[open]>summary::after{content:"\2013"}
.item-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.item-b ul,.item-b ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.nums{display:flex;gap:14px;font-size:.84rem;color:var(--muted)}
.plate{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto;gap:3px;border-radius:var(--r);overflow:hidden;font-size:.82rem;font-weight:600}
.plate div{padding:10px;min-width:0}
.plate .a{background:var(--fast-soft)}
.plate .b{background:var(--eat-soft)}
/* latihan */
.ex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig{width:100%;display:block;aspect-ratio:12/11}
.fig-lg{max-width:260px;margin:0 auto}
.fig line{stroke:var(--fig);stroke-width:5;stroke-linecap:round}
.fig line.far{stroke:var(--fig2)}
.fig line.g{stroke:var(--line);stroke-width:2}
.fig circle{fill:var(--fig)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.84rem;font-weight:600;color:var(--muted)}
input,select,textarea{min-height:46px;width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea{min-height:90px;font-size:.84rem}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--fast);flex:none;padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.proto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.proto button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;padding:6px 2px}
.proto button[aria-pressed="true"]{background:var(--fast);color:var(--on-fast);border-color:var(--fast)}
.proto small{display:block;font-weight:500;font-size:.72rem}
/* sesi */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.session .inner{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;text-align:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fast)}
.big{font:700 4rem/1 var(--display);font-variant-numeric:tabular-nums}
/* grafik & stat */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat b{display:block;font:700 1.6rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.chart{width:100%;display:block;height:auto}
.chart text{font:500 11px var(--body);fill:var(--muted)}
.chart .hit{fill:transparent;cursor:pointer}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.empty-fade{opacity:.45}
.hist{display:flex;flex-direction:column}
.hist>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hist>div:first-child{border-top:0}
.x{border:0;background:none;color:var(--muted);width:40px;height:40px;cursor:pointer;font-size:1.2rem;flex:none}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
nav svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--fast)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;width:max-content;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>

/* ---------- waktu ---------- */
const p2=n=>String(n).padStart(2,'0');
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const fromMin=m=>{m=((m%1440)+1440)%1440;return p2(Math.floor(m/60))+':'+p2(m%60)};
const tm=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const midnight=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const dateId=(ts,o={day:'numeric',month:'short'})=>new Date(ts).toLocaleDateString('id-ID',o);
const dur=ms=>{const m=Math.round(ms/60000);return Math.floor(m/60)+'j '+p2(m%60)+'m'};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000));return p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const eatH=()=>24-S.protocol;
const eatS=()=>toMin(S.eatStart);
const eatE=()=>eatS()+eatH()*60;
const inEat=()=>{const x=((nowMin()-eatS())+1440)%1440;return x<eatH()*60};
function nextAt(minOfDay){const n=Date.now(),b=midnight(n)+((minOfDay%1440)*60000);return b>n?b:b+864e5}
function lastAt(minOfDay){return nextAt(minOfDay)-864e5}

/* ---------- pengingat ---------- */
function events(dayTs){const d=midnight(dayTs),r=S.rem,o=[];const add=(m,title,body)=>o.push({ts:d+((m%1440+1440)%1440)*60000,title,body});
 if(r.close)add(eatE()-30,'Makan terakhir','Jendela makan tutup 30 menit lagi, pukul '+fromMin(eatE())+'.');
 if(r.start)add(eatE(),'Mulai puasa','Jendela makan sudah tutup. Buka Jeda untuk mulai mencatat.');
 if(r.open)add(eatS(),'Waktunya buka puasa','Mulai dari air dan makanan ringan berprotein.');
 if(r.move)add(toMin(r.moveAt),'Waktunya bergerak','Sesi singkat sudah cukup untuk hari ini.');
 if(r.water)for(let m=9*60;m<=21*60;m+=180){const x=((m-eatS())+1440)%1440;if(x>=eatH()*60)add(m,'Minum air','Satu gelas dulu. Tubuh tetap perlu cairan saat puasa.')}
 return o.sort((a,b)=>a.ts-b.ts)}
function nextEvent(){const n=Date.now();return events(n).concat(events(n+864e5)).find(e=>e.ts>n)}
function notify(title,body){
 toast(title+': '+body);
 try{if(!('Notification'in window)||Notification.permission!=='granted')return;
  const o={body,icon:'icon-192.png',badge:'icon-192.png',tag:title};
  if(S.push&&title!=='Contoh pengingat')return;
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o));
  else new Notification(title,o)}catch(e){}}
function checkReminders(){const n=Date.now();const from=Math.max(S.lastCheck||n,n-20*60000);
 const due=events(n-864e5).concat(events(n)).filter(e=>e.ts>from&&e.ts<=n);
 if(due.length){const e=due[due.length-1];notify(e.title,e.body)}
 if(S.lastCheck!==n){S.lastCheck=n;save()}}
/* push dari server */
const canPush=()=>!!document.querySelector('link[rel=manifest]')&&'serviceWorker'in navigator&&'PushManager'in window;
const b64u=s=>{const r=atob((s+'==='.slice((s.length+3)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
function pushCfg(){let tz='Asia/Jakarta';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
 return{tz,eatStart:S.eatStart,protocol:S.protocol,rem:S.rem,fastDoneAt:S.fast?S.fast.start+S.fast.target*36e5:null}}
async function pushPost(action){const r=await navigator.serviceWorker.ready,sub=await r.pushManager.getSubscription();if(!sub)throw new Error('nosub');
 const res=await fetch('/api/push/sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,sub:sub.toJSON(),cfg:pushCfg()})});if(!res.ok)throw new Error(await res.text());return sub}
let syncT,syncedAt='';
function queueSync(){if(!S.push)return;clearTimeout(syncT);syncT=setTimeout(async()=>{const c=JSON.stringify(pushCfg());if(c===syncedAt)return;try{await pushPost('sync');syncedAt=c}catch(e){}},1200)}
async function pushOn(){if(await Notification.requestPermission()!=='granted')throw new Error('denied');
 const r=await navigator.serviceWorker.ready;let sub=await r.pushManager.getSubscription();
 if(!sub){const k=await(await fetch('/api/push/key')).json();sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.publicKey)})}
 await pushPost('test');S.push=true;save()}
async function pushOff(){try{const r=await navigator.serviceWorker.ready,sub=await r.pushManager.getSubscription();if(sub){await pushPost('remove');await sub.unsubscribe()}}catch(e){}S.push=false;save()}
async function pushCheck(){if(!S.push||!canPush())return;try{const r=await navigator.serviceWorker.ready;if(!await r.pushManager.getSubscription()){S.push=false;save();return}syncedAt='';queueSync()}catch(e){}}
function gcal(title,minOfDay,details){const b=new Date(nextAt(minOfDay)),e=new Date(b.getTime()+15*60000);
 const f=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
 let tz='Asia/Jakarta';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(x){}
 return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+f(b)+'/'+f(e)+'&ctz='+encodeURIComponent(tz)+'&details='+encodeURIComponent(details)+'&recur='+encodeURIComponent('RRULE:FREQ=DAILY')}

function figSvg(id,cls=''){const L=(c='')=>`<line class="${c}"/>`;return `<svg class="fig ${cls}" viewBox="0 0 120 110" data-fig="${id}" role="img" aria-label="Gerakan ${EX[id].n}"><line class="g" x1="4" y1="105" x2="116" y2="105"/>${L('far').repeat(5)}${L().repeat(7)}<circle r="7"/></svg>`}
function drawFig(svg,t){const ex=EX[svg.dataset.fig],A=ex.a,B=ex.b,q=k=>[A[k][0]+(B[k][0]-A[k][0])*t,A[k][1]+(B[k][1]-A[k][1])*t];
 const seg=[['s','e2'],['e2','w2'],['p','k2'],['k2','a2'],['a2','t2'],['h','s'],['s','p'],['s','e'],['e','w'],['p','k'],['k','a'],['a','t']];
 const ls=svg.querySelectorAll('line:not(.g)');seg.forEach(([x,y],i)=>{const a=q(x),b=q(y);ls[i].setAttribute('x1',a[0]);ls[i].setAttribute('y1',a[1]);ls[i].setAttribute('x2',b[0]);ls[i].setAttribute('y2',b[1])});
 const c=svg.querySelector('circle'),h=q('h');c.setAttribute('cx',h[0]);c.setAttribute('cy',h[1])}
function animate(svg){const ex=EX[svg.dataset.fig];if(matchMedia('(prefers-reduced-motion: reduce)').matches){drawFig(svg,.9);return()=>{}}
 let raf,go=true;const t0=performance.now();const f=n=>{if(!go)return;const x=((n-t0)/1000/ex.sec)%1;drawFig(svg,.5-.5*Math.cos(x*2*Math.PI));raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);return()=>{go=false;cancelAnimationFrame(raf)}}

function arc(r,a0,a1){const pt=m=>{const a=m/1440*2*Math.PI-Math.PI/2;return[150+r*Math.cos(a),150+r*Math.sin(a)]};let d=((a1-a0)%1440+1440)%1440;if(d<1)d=1439.9;const[x0,y0]=pt(a0),[x1,y1]=pt(a0+d);return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${d>720?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}
function dialSvg(){const ticks=[];for(let h=0;h<24;h++){const a=h/24*2*Math.PI-Math.PI/2,big=h%6===0,r0=big?102:105;ticks.push(`<line x1="${(150+r0*Math.cos(a)).toFixed(1)}" y1="${(150+r0*Math.sin(a)).toFixed(1)}" x2="${(150+110*Math.cos(a)).toFixed(1)}" y2="${(150+110*Math.sin(a)).toFixed(1)}" stroke="var(--muted)" stroke-width="${big?2:1}"/>`)}
 const lab=['00','06','12','18'].map((t,i)=>{const a=i/4*2*Math.PI-Math.PI/2;return `<text x="${(150+89*Math.cos(a)).toFixed(1)}" y="${(154+89*Math.sin(a)).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">${t}</text>`}).join('');
 return `<svg viewBox="0 0 300 300" aria-hidden="true"><path d="${arc(130,eatE(),eatS())}" fill="none" stroke="var(--fast)" stroke-width="16"/><path d="${arc(130,eatS(),eatE())}" fill="none" stroke="var(--eat)" stroke-width="16"/>${ticks.join('')}${lab}<path id="dProg" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><circle id="dNow" r="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/></svg>`}

 startAt(){S.fast={start:lastAt(eatE()),target:S.protocol};save();render()},
 end(){const f=S.fast,n=Date.now();if(n-f.start>=6e4)S.fasts.push({start:f.start,end:n,target:f.target});S.fast=null;save();toast(n-f.start>=6e4?'Puasa '+dur(n-f.start)+' tercatat.':'Puasa dibatalkan.');render()},
 editStart(){const d=new Date(S.fast.start-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);openSheet(`<h2>Ubah waktu mulai</h2><div class="field"><label for="eS">Mulai puasa</label><input id="eS" type="datetime-local" value="${d}"></div><button class="btn primary block" data-act="saveStart">Simpan</button><button class="link" data-act="cancelFast">Batalkan puasa ini</button>`)},
 saveStart(){const v=new Date($('#eS').value).getTime(),n=Date.now();if(!v||v>n||n-v>48*36e5){toast('Pilih waktu dalam 48 jam terakhir.');return}S.fast.start=v;save();closeSheet();render()},
 cancelFast(){S.fast=null;save();closeSheet();render()},
 install(){if(deferred){deferred.prompt();deferred=null;closeSheet()}},
 async pushOn(){const b=$('#pOn');b.disabled=true;b.textContent='Mengaktifkan...';try{await pushOn();toast('Notifikasi aktif. Tes sedang dikirim.')}catch(e){toast(e.message==='denied'?'Izin ditolak. Izinkan notifikasi di pengaturan HP.':'Gagal mengaktifkan. Periksa internet lalu coba lagi.')}openReminders()},
 async pushOff(){await pushOff();toast('Notifikasi dimatikan.');openReminders()},
 async pushTest(){try{await pushPost('test');toast('Tes terkirim. Tunggu beberapa detik.')}catch(e){toast('Tes gagal. Periksa internet lalu coba lagi.')}},
 copyData(){const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('Cadangan disalin.'),()=>{const x=$('#sRestore');x.value=t;x.select();toast('Salin teks yang terpilih di kotak.')})},
 restore(){try{const o=JSON.parse($('#sRestore').value);if(!Array.isArray(o.fasts))throw 0;S=merge(o);save();applyTheme();closeSheet();render();toast('Data dipulihkan.')}catch(e){toast('Teks cadangan tidak terbaca. Salin ulang lalu coba lagi.')}},
 wipe(e){const b=$('#wipe');if(b.dataset.c){S=merge({});save();applyTheme();closeSheet();render();toast('Semua data dihapus.')}else{b.dataset.c=1;b.textContent='Tekan sekali lagi untuk menghapus'}},
 sPause(){ses.run=!ses.run;$('#sP').textContent=ses.run?'Jeda':'Lanjut'},
 sSkip(){sNext()},
 sStop(){sEnd(false)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-tab],[data-water],[data-filter],[data-fav],[data-ex],[data-plan],[data-proto],[data-delf],[data-close],[data-bar]');
 if(!t){if(e.target.matches('[data-scrim]'))closeSheet();return}const d=t.dataset;
 if(d.act)ACT[d.act](e);
 else if(d.tab){closeSheet();tab=d.tab;render();scrollTo(0,0)}
 else if(d.water){const k=dayKey(Date.now()),v=+d.water;S.water[k]=(S.water[k]===v)?v-1:v;save();rHome()}
 else if(d.filter){menuFilter=d.filter;rMenu()}
 else if(d.fav){const i=+d.fav,at=S.favs.indexOf(i);at<0?S.favs.push(i):S.favs.splice(at,1);save();t.textContent=at<0?'Hapus dari favorit':'Simpan ke favorit'}
 else if(d.ex)openEx(d.ex);
 else if(d.plan)startPlan(d.plan);
 else if(d.proto){S.protocol=+d.proto;if(S.fast)S.fast.target=S.protocol;save();render();openSettings()}
 else if(d.delf){S.fasts.splice(+d.delf,1);save();rProg()}
 else if(d.bar){$('#barCap').textContent=d.bar}
 else if('close'in d)closeSheet()});
document.addEventListener('change',e=>{const t=e.target,v=t.value;
 if(t.id==='sEat'&&v){S.eatStart=v}else if(t.id==='sGoal'){S.waterGoal=Math.min(16,Math.max(1,+v||8))}else if(t.id==='sTw'){S.targetWeight=+v||null}else if(t.id==='sTheme'){S.theme=v;applyTheme()}else if(t.id==='rMove'&&v){S.rem.moveAt=v}else if(t.dataset.rem){S.rem[t.dataset.rem]=t.checked}else return;save();render()});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='wForm'){const kg=+$('#wKg').value,ts=new Date($('#wDate').value+'T12:00').getTime();if(!kg)return;S.weights=S.weights.filter(w=>dayKey(w.ts)!==dayKey(ts));S.weights.push({ts,kg});save();rProg();toast('Berat tersimpan.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ses)closeSheet()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();pushCheck();if(tab==='home')rHome()}});
if('serviceWorker'in navigator&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();checkReminders();pushCheck();
setInterval(()=>{tick();if(new Date().getSeconds()%30===0)checkReminders()},1000);
</script>

</body>
</html>
